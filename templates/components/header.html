<header class="sticky top-0 z-50 bg-white shadow-sm">
    <div class="container mx-auto px-4 py-3">
        <div class="flex items-center gap-6">
            <a href="/" class="shrink-0">
                <img src="https://www.digikala.com/statics/img/svg/logo.svg" alt="Digikala" class="h-8">
            </a>
            <div class="flex-1 max-w-2xl relative hidden md:block">
                <i data-lucide="search" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                <input type="text" placeholder="جستجو در دیجی‌کالا..." class="w-full bg-gray-100 rounded-lg pr-12 pl-4 py-2.5 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-digikala-red/20 transition-all border border-transparent focus:border-digikala-red">
            </div>
            <div class="flex items-center gap-4 shrink-0 mr-auto">
                <button class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-lg border border-gray-200 text-gray-700 text-sm font-bold hover:border-digikala-red hover:text-digikala-red transition">
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    <span>ورود | ثبت‌نام</span>
                </button>
                <span class="w-px h-6 bg-gray-200 hidden sm:block"></span>
                <button class="relative p-2 rounded-lg text-gray-700 hover:bg-gray-100 transition">
                    <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </div>
</header>

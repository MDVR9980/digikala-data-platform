{% extends "base.html" %}

{% block content %}
<div class="py-4 space-y-8">
    
    <!-- Hero Banner -->
    <section class="container mx-auto px-4">
        <div class="relative h-44 sm:h-64 lg:h-72 rounded-xl overflow-hidden shadow-sm">
            <img src="https://images.pexels.com/photos/5624997/pexels-photo-5624997.jpeg?auto=compress&cs=tinysrgb&w=1200" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-l from-digikala-red/80 to-transparent flex flex-col justify-center pr-8">
                <h2 class="text-white text-2xl md:text-3xl font-extrabold mb-2">فروش ویژه تابستانه</h2>
                <button class="mt-4 bg-white text-digikala-red px-5 py-2 rounded-lg text-sm font-bold w-fit shadow-md">مشاهده محصولات</button>
            </div>
        </div>
    </section>

    <!-- Amazing Sales -->
    <section class="container mx-auto px-4">
        <div class="bg-digikala-red rounded-xl overflow-hidden shadow-lg p-4 flex">
            <!-- Title section -->
            <div class="shrink-0 w-32 md:w-44 flex flex-col items-center justify-center text-white text-center ml-4 border-l border-white/20 pl-4">
                <h3 class="text-lg md:text-xl font-extrabold mb-1">پیشنهاد<br>شگفت‌انگیز</h3>
            </div>
            
            <!-- Products Container -->
            <div id="products-container" class="flex gap-3 overflow-x-auto scrollbar-hide py-2 flex-1">
                <!-- محصولات با جاوااسکریپت اینجا لود می شوند -->
                <p id="loading-text" class="text-white text-sm">در حال بارگذاری محصولات...</p>
            </div>
        </div>
    </section>

</div>
{% endblock %}

{% block scripts %}
<script>
    // درخواست به API خودتان که در main.py ساخته‌اید
    document.addEventListener("DOMContentLoaded", function() {
        fetch('/products?limit=10')
            .then(response => response.json())
            .then(products => {
                const container = document.getElementById('products-container');
                container.innerHTML = ''; // پاک کردن متن لودینگ
                
                products.forEach(product => {
                    // محاسبه قیمت تخفیف خورده (برای سادگی فرض میکنیم بک اند تخفیف رو نمیده یا شما حساب میکنید)
                    const html = `
                        <a href="/product/${product.id}" class="shrink-0 w-40 sm:w-44 bg-white rounded-xl p-3 hover:shadow-lg transition-shadow group block">
                            <div class="relative aspect-square bg-gray-50 rounded-lg overflow-hidden mb-3">
                                <img src="https://via.placeholder.com/200" alt="${product.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                            </div>
                            <h3 class="text-xs text-gray-700 leading-relaxed mb-2 line-clamp-2 h-8 overflow-hidden">${product.title}</h3>
                            <div class="flex items-center gap-1 justify-end">
                                <span class="text-sm font-bold text-gray-800">${formatPrice(product.price || 0)}</span>
                                <span class="text-[10px] text-gray-500">تومان</span>
                            </div>
                        </a>
                    `;
                    container.innerHTML += html;
                });
            })
            .catch(error => {
                document.getElementById('loading-text').innerText = 'خطا در دریافت اطلاعات';
                console.error(error);
            });
    });
</script>
{% endblock %}

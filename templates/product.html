{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- تصویر (راست) -->
        <div class="lg:col-span-4">
            <div class="bg-white rounded-xl border border-gray-100 p-4">
                <img src="https://via.placeholder.com/400" class="w-full rounded-lg" alt="Product Image">
            </div>
        </div>

        <!-- اطلاعات محصول (وسط) -->
        <div class="lg:col-span-5 bg-white rounded-xl border border-gray-100 p-5">
            <h1 id="product-title" class="text-lg sm:text-xl font-bold text-gray-900 mb-4">در حال بارگذاری...</h1>
            <p id="product-desc" class="text-sm text-gray-600 leading-loose"></p>
        </div>

        <!-- باکس خرید (چپ) -->
        <div class="lg:col-span-3">
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 sticky top-24">
                <div class="flex items-center gap-2 pb-3 border-b border-gray-200">
                    <i data-lucide="store" class="w-5 h-5 text-gray-600"></i>
                    <span class="text-sm text-gray-700">فروشنده:</span>
                    <span class="text-sm font-bold">دیجی‌کالا</span>
                </div>
                <div class="py-4">
                    <div class="flex items-baseline gap-1 justify-end">
                        <span id="product-price" class="text-2xl font-extrabold text-gray-900">...</span>
                        <span class="text-sm text-gray-500">تومان</span>
                    </div>
                </div>
                <button class="w-full bg-digikala-red text-white py-3.5 rounded-xl font-bold text-sm hover:bg-digikala-red-dark">
                    افزودن به سبد خرید
                </button>
            </div>
        </div>
    </div>

    <!-- تب ها -->
    <div class="mt-8 bg-white rounded-xl border border-gray-100 overflow-hidden">
        <div class="flex border-b border-gray-100">
            <button onclick="switchTab('desc')" id="tab-desc" class="px-6 py-4 text-sm font-medium text-digikala-red border-b-2 border-digikala-red">درباره محصول</button>
            <button onclick="switchTab('comments')" id="tab-comments" class="px-6 py-4 text-sm font-medium text-gray-500 border-b-2 border-transparent">نظرات کاربران</button>
        </div>
        
        <div class="p-5">
            <!-- تب توضیحات -->
            <div id="content-desc" class="block">
                <p id="full-desc" class="text-sm text-gray-600 leading-loose">توضیحات در حال بارگذاری...</p>
            </div>
            
            <!-- تب نظرات -->
            <div id="content-comments" class="hidden">
                <div id="comments-list" class="space-y-4">
                    <!-- نظرات با JS لود می‌شوند -->
                    <p class="text-sm text-gray-500">در حال دریافت نظرات...</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // دریافت ID محصول از FastAPI از طریق Jinja
    const productId = {{ product_id }};

    // منطق تب‌ها
    function switchTab(tab) {
        if(tab === 'desc') {
            document.getElementById('content-desc').classList.remove('hidden');
            document.getElementById('content-comments').classList.add('hidden');
            document.getElementById('tab-desc').classList.add('text-digikala-red', 'border-digikala-red');
            document.getElementById('tab-desc').classList.remove('text-gray-500', 'border-transparent');
            
            document.getElementById('tab-comments').classList.remove('text-digikala-red', 'border-digikala-red');
            document.getElementById('tab-comments').classList.add('text-gray-500', 'border-transparent');
        } else {
            document.getElementById('content-comments').classList.remove('hidden');
            document.getElementById('content-desc').classList.add('hidden');
            document.getElementById('tab-comments').classList.add('text-digikala-red', 'border-digikala-red');
            document.getElementById('tab-comments').classList.remove('text-gray-500', 'border-transparent');
            
            document.getElementById('tab-desc').classList.remove('text-digikala-red', 'border-digikala-red');
            document.getElementById('tab-desc').classList.add('text-gray-500', 'border-transparent');
        }
    }

    // لود کردن دیتای محصول
    document.addEventListener("DOMContentLoaded", function() {
        // ۱. دریافت مشخصات محصول
        fetch(`/products/${productId}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('product-title').innerText = data.title;
                document.getElementById('product-price').innerText = formatPrice(data.price || 0); // قیمت رو از لیست فروشندگان هم میشه گرفت
                if(data.description) {
                    document.getElementById('product-desc').innerText = data.description;
                    document.getElementById('full-desc').innerText = data.description;
                }
            })
            .catch(console.error);

        // ۲. دریافت نظرات
        fetch(`/products/${productId}/comments`)
            .then(res => res.json())
            .then(comments => {
                const list = document.getElementById('comments-list');
                list.innerHTML = '';
                if(comments.length === 0) {
                    list.innerHTML = '<p class="text-sm text-gray-500">نظری ثبت نشده است.</p>';
                    return;
                }
                comments.forEach(comment => {
                    list.innerHTML += `
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="bg-gray-200 text-xs px-2 py-1 rounded">امتیاز: ${toPersianDigits(comment.rate)}</span>
                                <h4 class="text-sm font-bold">${comment.title || 'بدون عنوان'}</h4>
                            </div>
                            <p class="text-sm text-gray-600">${comment.body}</p>
                        </div>
                    `;
                });
            })
            .catch(console.error);
    });
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دیجی‌کالا</title>
    <!-- Vazirmatn Font -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS (برای توسعه - در پروداکشن باید بیلد شود) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { digikala: { red: '#ef4056', 'red-dark': '#d63848' } },
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f9fafb; }
        /* مخفی کردن اسکرول‌بار برای اسلایدرها */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white shadow-sm border-b border-gray-100">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center gap-4">
                <a href="/" class="flex items-center gap-2 shrink-0">
                    <span class="text-2xl font-extrabold text-digikala-red">دیجی‌کالا</span>
                </a>
                <div class="flex-1 max-w-2xl relative hidden md:block">
                    <i data-lucide="search" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                    <input type="text" placeholder="جستجو در دیجی‌کالا..." class="w-full bg-gray-100 rounded-lg pr-10 pl-4 py-2.5 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-digikala-red/30 focus:bg-white transition-all">
                </div>
                <div class="flex items-center gap-3 shrink-0 mr-auto">
                    <button class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-lg border border-gray-200 text-gray-700 text-sm font-medium hover:border-digikala-red hover:text-digikala-red">
                        <i data-lucide="user" class="w-5 h-5"></i>
                        <span>ورود | ثبت‌نام</span>
                    </button>
                    <button class="relative p-2 rounded-lg text-gray-700 hover:bg-gray-100">
                        <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content (محتوای صفحات اینجا قرار میگیرد) -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="container mx-auto px-4 py-10 text-center text-sm text-gray-500">
            <p>کلیه حقوق این سایت متعلق به دیجی‌کالا می‌باشد.</p>
        </div>
    </footer>

    <!-- Initialize Icons -->
    <script>
        lucide.createIcons();
        
        // تابع تبدیل اعداد انگلیسی به فارسی
        const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
        function toPersianDigits(num) {
            return num.toString().replace(/\d/g, x => persianDigits[x]);
        }
        function formatPrice(price) {
            return toPersianDigits(price.toLocaleString('en-US'));
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
